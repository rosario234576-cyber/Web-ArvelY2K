<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2f1e2a">
    <link rel="icon" type="image/png" href="assets/logo/IsoBlanco.png?v=20260804-brand">
    <title>Estado del pago | Arvel Custom Y2K</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">

    <div id="site-header"></div>
    <main class="auth-page" id="main-content">
      <div class="container auth-layout">
        <div class="auth-intro">
          <span class="eyebrow">Checkout seguro</span>
          <h1 class="display-title">Tu pago</h1>
          <p class="lead">Estamos verificando el resultado directamente con Mercado Pago.</p>
        </div>
        <section class="auth-card auth-account" aria-live="polite">

          <p id="payment-result-message">No cierres esta ventana mientras consultamos el estado.</p>
          <div class="auth-account__identity" id="payment-result-details" hidden></div>
          <div class="cluster">
            <a class="button button--pink" href="tienda.html">Volver al shop</a>

        </section>

    </main>
    <div id="site-footer"></div>
    <div id="global-overlays"></div>
