name: Sincronizar Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4.2.2
      - name: Usar Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
      - name: Leer publicaciones de Instagram
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
        run: node scripts/sync-instagram.mjs
      - name: Publicar feed actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-feed.json
          git diff --cached --quiet || git commit -m "chore: actualizar feed de Instagram"
          git push
